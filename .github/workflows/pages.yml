# Publishes site/ (the reader-facing book only) to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish the book
on:
  push:
    branches: [main]
    paths: ['viewer/**', 'art/**', 'tools/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_site.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

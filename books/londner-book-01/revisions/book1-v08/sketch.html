<style>
:root{--room:#0d0907;--ink:#1b1410;--gold:#e0a84f;--paper:#fffdf6;--rim:#efe3c8;--cap:#fff6e4;--capbg:rgba(10,7,4,.62);--muted:#b9a88c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--room);color:var(--cap);font-family:Heebo,system-ui,sans-serif}
header{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding:.6rem 16px;background:rgba(13,9,7,.92);backdrop-filter:blur(6px);border-bottom:1px solid #3a2a18}
header h1{margin:0;font:900 1.25rem 'Frank Ruhl Libre',serif;color:var(--gold)}
header .prog{font-size:.85rem;color:var(--muted)}
header .bar{display:inline-block;width:120px;height:6px;border-radius:3px;background:#2b2016;vertical-align:middle;margin-inline-start:.4rem;overflow:hidden}
header .bar i{display:block;height:100%;background:var(--gold)}
header .ctl{display:flex;gap:.4rem;flex-wrap:wrap}
header button{font:700 .8rem Heebo,sans-serif;color:var(--cap);background:#2a1d12;border:1px solid #5a4126;border-radius:999px;padding:.35rem .8rem;cursor:pointer}
header button[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
main{padding:2vh 16px 10vh}
.pagewrap{max-width:860px;margin:0 auto 6vh}
.plabel{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 .5rem;color:var(--muted);font-size:.8rem;letter-spacing:.08em}
.plabel b{font:700 1rem 'Frank Ruhl Libre',serif;color:var(--cap);letter-spacing:0}
.note{display:none;margin:.6rem 0 0;padding:.6rem .8rem;border-inline-start:3px solid var(--gold);background:#1d140c;color:#e9dcc3;font-size:.85rem;line-height:1.5}
body.work .note{display:block}
.page{position:relative;width:100%;aspect-ratio:100/141;container-type:inline-size;background:#140e09;border-radius:4px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.cv{position:absolute;inset:1.8%}
.pw{position:absolute;filter:drop-shadow(1.5px 0 0 var(--rim)) drop-shadow(-1.5px 0 0 var(--rim)) drop-shadow(0 1.5px 0 var(--rim)) drop-shadow(0 -1.5px 0 var(--rim)) drop-shadow(0 14px 18px rgba(0,0,0,.5))}
.pw.soft{filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.pw.circle{z-index:6}
.pw.morphtop{z-index:3}
.shape{position:absolute;inset:0;overflow:hidden;background:#2a2119}
.pw.circle .shape{border-radius:50%;box-shadow:inset 0 0 0 3px var(--rim)}
.shape img{width:100%;height:100%;object-fit:cover;object-position:50% 32%;display:block;transform:scale(1.03)}
html[dir=ltr] .shape img{transform:scale(1.03) scaleX(-1)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.5em;padding:12% 10%;text-align:center;background:repeating-linear-gradient(135deg,#3b3026 0 8px,#362b22 8px 16px);color:#d8c7aa;font-size:1.55cqw;line-height:1.35}
.ph em{font-style:normal;font:700 .85em Heebo;letter-spacing:.12em;color:var(--gold);border:1px solid #6a4f2c;border-radius:999px;padding:.15em .7em}
.ph.new em{background:#5b3a12}
.pid{display:none;position:absolute;bottom:3px;inset-inline-start:4px;font:700 9px Heebo;color:#ffe9b8;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:3px;z-index:4;direction:ltr}
body.work .pid{display:block}
/* lettering */
.tx{position:absolute;z-index:20;font-size:clamp(.62rem,1.85cqw,1.12rem);line-height:1.3;text-wrap:balance;text-align:center}
.tx.cap{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--cap);background:var(--capbg);box-shadow:0 0 1em .6em var(--capbg);padding:.15em .35em;border-radius:.6em;text-shadow:0 1px 2px #000;text-align:start}
.tx.bub,.tx.tho,.tx.whi{font-family:Rubik,sans-serif;font-weight:600;color:var(--ink);background:var(--paper);border:2.6px solid var(--ink);border-radius:50%/46%;padding:.7em 1.15em;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.tx.tho{border-radius:42%/40%}
.tx.whi{border-style:dashed}
.tx.sho{font-family:Rubik,sans-serif;font-weight:700;color:var(--ink);background:#ffe27a;border:2.6px solid var(--ink);padding:.7em 1.1em;clip-path:polygon(0 18%,12% 0,25% 14%,40% 0,55% 12%,70% 0,84% 14%,100% 4%,92% 30%,100% 52%,90% 70%,100% 92%,80% 86%,64% 100%,50% 86%,34% 100%,20% 86%,4% 96%,10% 70%,0 50%,8% 32%)}
.tx .who{display:none}
.tx svg.kids{width:7.5em;height:4.2em;display:block}
.tail{position:absolute;z-index:21;overflow:visible;pointer-events:none}
.flag{display:none;position:absolute;top:-.7em;inset-inline-end:-.6em;font-size:.75em;background:#2a1d12;color:#ffd27a;border:1px solid #6a4f2c;border-radius:999px;padding:0 .4em;font-family:Heebo;font-weight:800}
body.work .tx.isnew{outline:2px dashed #ffb84d;outline-offset:3px}
body.work .flag.on{display:block}
.legend{display:none;max-width:860px;margin:0 auto 3vh;padding:.8rem 1rem;background:#1d140c;border:1px solid #3a2a18;border-radius:8px;font-size:.85rem;line-height:1.6;color:#e9dcc3}
body.work .legend{display:block}
.intro{max-width:860px;margin:3vh auto 4vh;text-align:center}
.intro h2{margin:0;font:900 clamp(2rem,6vw,3.4rem) 'Frank Ruhl Libre',serif;color:var(--gold)}
.intro p{margin:.4rem 0 0;color:var(--muted)}
/* phone: one column, each panel its own block, text big */
@media (max-width:700px){
  .cv{position:static;display:flex;flex-direction:column;gap:14px}
  .page{aspect-ratio:auto;background:none;box-shadow:none;display:flex;flex-direction:column;gap:14px}
  .pw{position:relative!important;left:auto!important;top:auto!important;width:100%!important;container-type:inline-size}
  .pw.circle{width:72%!important;align-self:center}
  .tx{font-size:clamp(.85rem,4.1cqw,1.08rem)}
  .ph{font-size:3.6cqw}
}
@media (prefers-reduced-motion:no-preference){.pw{animation:in .6s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}}
</style>

ero": false, "poly": [[0, 0], [100, 0], [100.0, 41.93], [0.0, 34.93]], "fade": "b", "soft": true}, {"id": "B01V07-P23-02", "shows": "זיכרון נפרד של האב בבית, ללא גופה, בית קברות, אמבולנס או רגע מוות. התאורה טבעית, לא איום.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "כעבור זמן נפטר גם אבא.", "en": "Some time later, Father passed away too.", "kind": "adapted", "memoir": "אבי ז\"ל קיבל התקף לב ולא הרבה זמן נפטר", "isnew": false}], "new": false, "hero": false, "poly": [[51.71, 84.69], [0.0, 88.31], [0.0, 22.93], [45.85, 26.14]], "soft": true}, {"id": "B01V07-P23-03", "shows": "יצחק עם אחיו חיים הבכור; עצב שקט לצד נוכחות קרובה, בלי הבעות אימה או חיוך כפוי.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "אלה זיכרונות עצובים. אבל לא נשארנו בלי מי שידאג לנו.", "en": "These are sad memories. But we were not left without someone to care for us.", "kind": "editorial", "memoir": "הדוד שמעון לא רצה שישאירו חובות אחרי אבא ז\"ל", "isnew": false}], "new": false, "hero": false, "poly": [[100.0, 29.93], [100.0, 81.31], [54.09, 84.52], [48.27, 26.31]], "soft": true}, {"id": "B01V07-P23-04", "shows": "מאיר גיטלר רושם רשימה של הסחורה בחנות; חיים לצד הסחורה. שחזור מן המקור, לא כינוס מסוים שנמצא בצילום.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "הדוד שמעון לא רצה שיישארו חובות.", "en": "Uncle Shimon did not want any debts left behind.", "kind": "adapted", "memoir": "הדוד שמעון לא רצה שישאירו חובות אחרי אבא ז\"ל", "isnew": false}, {"type": "caption", "speaker": "יצחק המבוגר", "he": "חיים אחי לקח עליו את החובות ובא לגור ביונדזיוב.", "en": "My brother Chaim took on the debts and came to live in Jedrzejow.", "kind": "adapted", "memoir": "חיימלה אחי ייקח עליו את החובות וישלם ויבוא לגור לינדזיוב", "isnew": false}], "new": false, "hero": true, "poly": [[100.0, 83.71], [100, 141.0], [0, 141.0], [0.0, 90.71]], "soft": true}], "H": 141.0}, {"n": 24, "title": "כל אחד בדרך אחרת", "pace": "slow", "recipe": "2-wide", "note": "משפט ההחלטה עבר לכאן מעמוד 23 כדי לקצר שם כיתוב ארוך, ונוסף כיתוב מילולי מהיומן על קבלת שרהלה בשמחה, כהקלה חלקית בלי מתח נטישה.", "panels": [{"id": "B01V07-P24-01", "shows": "מפת משפחה חיה פשוטה: שמות האחים הבוגרים בנפרד ולא שמונה ילדים קטנים.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "אנחנו, הילדים, החלטנו איפה כל אחד יגור.", "en": "We, the children, decided where each of us would live.", "kind": "adapted", "memoir": "החלטנו שחוה תישאר עם רייזל", "isnew": false}, {"type": "caption", "speaker": "יצחק המבוגר", "he": "נשארנו במשפחה, אבל לא כולנו גרנו עוד באותו בית.", "en": "We stayed a family, but we no longer all lived in the same house.", "kind": "adapted", "memoir": "החלטנו שחוה תישאר עם רייזל... שרהלה תיסע לקילץ... שמעון ייסע לוורשה... לייבל ייסע למיעכוב", "isnew": false}], "new": false, "hero": false, "poly": [[0, 0], [47.7, 0.0], [53.45, 47.91], [0.0, 51.65]]}, {"id": "B01V07-P24-02", "shows": "חוה נשארת בבית עם רייזל הקטנה; שמעון ולייבל נשלחים לקרובים.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "חוה נשארה עם רייזל הקטנה.", "en": "Chava stayed with little Raisel.", "kind": "adapted", "memoir": "החלטנו שחוה תישאר עם רייזל - הכי קטנטונת בבית", "isnew": false}], "new": false, "hero": false, "poly": [[50.1, 0.0], [100, 0], [100.0, 44.65], [55.83, 47.74]]}, {"id": "B01V07-P24-03", "shows": "יצחק ושרהלה בדרך לבית הדודים בקילץ, עם חבילת הבגדים. לא מציירים ילדה לבד מול דלת סגורה ולא מייצרים מתח נטישה. הגיל של שרהלה כבת חמש לפי הזיכרון.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "את שרהלה הבאתי לדודים בקילץ. משם המשכתי לדוד מאיר בלודז׳.", "en": "I brought Sarale to our aunt and uncle in Kielce. From there I went on to Uncle Meir in Lodz.", "kind": "adapted", "memoir": "את שרהלה אני אקח עד קילץ, מתי אני אסע ללודז'", "isnew": false}, {"type": "caption", "speaker": "יצחק המבוגר", "he": "אחרי זמן מה שמעתי כי קיבלו אותה בשמחה.", "en": "After a while I heard they had welcomed her gladly.", "kind": "quote", "memoir": "אחרי זמן מה שמעתי כי קיבלו אותה בשמחה", "isnew": false}], "new": false, "hero": true, "poly": [[100.0, 47.05], [100, 141.0], [0, 141.0], [0.0, 54.05]]}], "H": 141.0}, {"n": 25, "title": "מה קרה אחרי הדלת", "pace": "slow", "recipe": "2-wide", "note": "הוסר פאנל 02 הכפול; הדגש עבר לשרהלה שלומדת עם הבנים, רגע ההקלה של העמוד. אין כאן שום רמז להמשך גורלה.", "panels": [{"id": "B01V07-P25-01", "shows": "מעבר מסומן לבית הדודים של שרהלה, לא התרחקות יצחק מילדה בודדה. זוהי המחשת ידיעה שקיבל לאחר מכן.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "אחר כך סיפרו לי על הבית החדש של שרהלה.", "en": "Later I was told about Sarale's new home.", "kind": "adapted", "memoir": "אחרי זמן מה שמעתי כי קיבלו אותה בשמחה", "isnew": false}], "new": false, "hero": false, "poly": [[0, 0], [47.7, 0.0], [53.45, 47.91], [0.0, 51.65]]}, {"id": "B01V07-P25-03", "shows": "וינייטה נפרדת של שרהלה עם דודה שרה ודוד אברהמלה; בת כחמש לצד שלושת בני הדוד.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "הדודים קיבלו אותה בשמחה. היו להם שלושה בנים, והיא התקבלה כמו בת.", "en": "My aunt and uncle welcomed her with joy. They had three sons, and she was taken in like a daughter.", "kind": "adapted", "memoir": "היו לו רק שלושה ילדים זכרים, בגלל זה קיבלו את אחותי שרהלה כבת", "isnew": false}], "new": false, "hero": false, "poly": [[50.1, 0.0], [100, 0], [100.0, 44.65], [55.83, 47.74]]}, {"id": "B01V07-P25-04", "shows": "שרהלה לומדת עם הבנים ומקבלת בגדים חדשים, לפי מה שסיפרו ליצחק.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "היא התיישבה ללמוד איתם. סיפרו שהיא ידעה אפילו יותר מהבנים.", "en": "She sat down to learn with them. They said she knew even more than the boys.", "kind": "adapted", "memoir": "סיפרו לי, כי היא הייתה יודעת יותר מהבנים שלו", "isnew": false}], "new": false, "hero": true, "poly": [[100.0, 47.05], [100, 141.0], [0, 141.0], [0.0, 54.05]]}], "H": 14 enteen.", "kind": "adapted", "memoir": "הייתי בערך בן 16-17 שנים", "isnew": false}, {"type": "thought", "speaker": "איטשע", "he": "אני רוצה להיות חקלאי בארץ ישראל.", "en": "I want to be a farmer in the Land of Israel.", "kind": "adapted_thought", "memoir": "וחשבתי בנוגע לנסוע לארץ - ישראל להיות חקלאי", "mouth": "Itsche on the right, face visible; thought bubble in the quiet sky on the left", "isnew": false}], "new": false, "hero": true, "poly": [[0, 0], [100, 0], [100.0, 74.42], [0.0, 67.42]]}, {"id": "B01V07-P33-03", "shows": "מסמכי המלצה מן התנועה, בלי כתב מובנה בתמונה.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "מהתנועה כבר היו לי המלצות ואישור עקרוני.", "en": "From the movement I already had recommendations and approval in principle.", "kind": "adapted", "memoir": "הסרפטיקטים מההנהלה הציונית היה אישור", "isnew": false}], "new": false, "hero": false, "poly": [[39.58, 141.0], [0, 141.0], [0.0, 69.82], [47.72, 73.16]]}, {"id": "B01V07-P33-04", "shows": "הוא מתעניין בדרך לנסיעה; מבט במסמכים בלי פקיד מסרב שהומצא.", "art": null, "texts": [{"type": "thought", "speaker": "איטשע", "he": "איך נוסעים?", "en": "How does one get there?", "kind": "adapted_thought", "memoir": "ותמיד חלמתי איך נוסעים", "mouth": "Itsche looking at the papers (no art yet), small thought bubble above him", "isnew": true}], "new": false, "hero": false, "poly": [[100.0, 76.82], [100, 141.0], [41.98, 141.0], [50.1, 73.33]]}], "H": 141.0}, {"n": 34, "title": "הדרך עוד סגורה", "pace": "fast", "recipe": "grow-4", "note": "רצועות משופעות למעבר זמן; הדרכון החסר (02) הופך לעיגול פרט בין הרצועות. הכיתובים נשארו, כי אין בפאנלים דמות שמדברת. עורך: העיגול הפך לפאנל רגיל בפריסה (בקשת המשתמש: עיגול רק פעם או פעמיים בספר).", "panels": [{"id": "B01V07-P34-01", "shows": "מפה וחפצי נסיעה שלא נארזו עדיין, כהמחשת חסם.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "הייתי צריך גם דרכון ואישורים נוספים. לא הצלחתי לקבל אותם.", "en": "I also needed a passport ", "panels": [{"id": "B01V07-P35-01", "shows": "יצחק מבוגר יותר במדי הצבא הפולני, לא הדמות בת הארבע.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "את ראובן כבר לקחו לצבא, ובבית היו צריכים אותי. אז השתמשתי בתעודת הלידה של לייבל אחי, ונשארתי עוד שנה.", "en": "Reuven had already been taken into the army, and I was needed at home. So I used my brother Leibl’s birth certificate and stayed one more year.", "kind": "adapted", "memoir": "את ראובן לקחו לצבא / ללייבל אחי הייתה תעודת לידה לשנת 1902, לקחתי את התעודה שלו", "isnew": false}], "new": false, "hero": false, "poly": [[0, 0], [100, 0], [100.0, 23.87], [0.0, 16.87]]}, {"id": "B01V07-P35-02", "shows": "יחידה במחנה, ללא ענישה גרפית.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "כשהגיע התור של ילידי 1902, התגייסתי.", "en": "When those born in 1902 were called up, I enlisted.", "kind": "adapted", "memoir": "עד שלקחו את 1902 לצבא חזרתי לינדזיב והלכתי לצבא", "isnew": false}, {"type": "thought", "speaker": "יצחק", "he": "לבשתי מדים של פולין, אבל חלמתי על השדות של ארץ ישראל.", "en": "I wore a Polish uniform, but I dreamed of the fields of the Land of Israel.", "kind": "adapted_thought", "memoir": "התאהבתי מאוד בחקלאות וחשבתי... לנסוע לארץ ישראל להיות חקלאי", "mouth": "center", "isnew": true}], "new": false, "hero": false, "poly": [[52.43, 95.5], [0.0, 99.17], [0.0, 19.27], [45.12, 22.43]]}, {"id": "B01V07-P35-03", "shows": "היחידה ליד נהר וגשר בלילה.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "לילה אחד האויב התקרב לגשר. בחרו חיילים טובים לשמירה, ואותי לא.", "en": "One night the enemy came close to the bridge. They chose good soldiers for the watch, but not me.", "kind": "adapted", "memoir": "בחרו חיילים טובים, לשמירה בגשר בלילה", "isnew": false}, {"type": "thought", "speaker": "יצחק", "he": "למה לא אני?", "en": "Why not me?", "kind": "adapted_thought", "memoir": "ולא ידעתי למה לא נתנו לי תפקיד", "mouth": "center", "isnew": true}], ander’s order.", "kind": "adapted_speech", "memoir": "לא רציתי לשמוע פקודה של קצינים זרים, כי שמרתי את הפקודה של הממונה עלי", "mouth": "right", "isnew": true}], "new": true, "hero": false, "poly": [[44.51, 0.0], [100, 0], [100.0, 34.73], [47.62, 31.06]]}, {"id": "B01V07-P36-02", "shows": "אור לפנות בוקר; רשרוש מיוצג גרפית בלי להראות צבא מזוהה במיקום מומצא.", "art": {"src": "../../art/book1-v07/web/B01V07-P36-02.webp", "w": 940, "h": 1672, "status": "generated-source-reviewed", "faces": []}, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "לפנות בוקר, בחושך, שמעתי רשרוש מרחוק.", "en": "Before dawn, in the dark, I heard a rustling far away.", "kind": "adapted", "memoir": "לפנות בוקר הרגשתי איזה רשרוש מרחוק", "isnew": false}, {"type": "thought", "speaker": "יצחק", "he": "הם מתקרבים!", "en": "They’re coming!", "kind": "adapted_thought", "memoir": "והרגשתי שבולשביקים מקרבים", "mouth": "center", "isnew": true}], "new": false, "hero": false, "poly": [[100.0, 37.13], [100.0, 78.28], [0.0, 85.28], [0.0, 30.13]]}, {"id": "NEW-P36-a", "shows": "עיגול תקריב: עיניו של יצחק החייל בחושך לפנות בוקר, מקשיב. בלי אויב נראה.", "art": null, "texts": [], "new": true, "hero": false, "circle": [62.0, 66.58, 34, 34]}, {"id": "B01V07-P36-03", "shows": "יצחק מעיר את היחידה, לא קריאת קרב מומצאת.", "art": {"src": "../../art/book1-v07/web/B01V07-P36-03.webp", "w": 1024, "h": 1536, "status": "generated-source-reviewed", "faces": [[50.5, 32.4, 16.1, 12.7], [26.0, 61.1, 18.4, 12.8]]}, "texts": [{"type": "shout", "speaker": "יצחק", "he": "קומו! האויב מתקרב!", "en": "Get up! The enemy is coming!", "kind": "staging", "memoir": "עשיתי רעש כזה", "mouth": "right", "isnew": true}, {"type": "caption", "speaker": "יצחק המבוגר", "he": "עשיתי רעש גדול, והערתי את כולם.", "en": "I made a great noise and woke everyone.", "kind": "adapted", "memoir": "עשיתי רעש כזה", "isnew": false}], "new": false, "hero": true, "poly": [[60.78, 141.0], [0, 141.0], [0.0, 87.68], [66.58, 83.02]]}, {"id": "B01V07-P36- be my wife, and your grandmother.", "kind": "adapted", "memoir": "אגיד לך אני רוצה אותך בתור חתן לבתי חוה", "isnew": false}], "new": false, "hero": true, "poly": [[100.0, 44.02], [100, 141.0], [0, 141.0], [0.0, 51.02]]}], "H": 141.0}, {"n": 39, "title": "הבית שלנו", "pace": "normal", "recipe": "wide-3", "note": "החתונה מקבלת את הפאנל הרחב, ונוספה בועת מחשבה קצרה על רעיון ארץ ישראל שיצחק שמר בסוד, כפי שכתוב ביומן.", "panels": [{"id": "B01V07-P39-01", "shows": "1922, נישואי יצחק וחוה, בלי המון קרובים שספירתם מומצאת.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "בשנת 1922 התחתנו. גרנו כמו שסיכמנו לפני החתונה.", "en": "In 1922 we were married. We lived as we had agreed before the wedding.", "kind": "adapted", "memoir": "התחתנו ב-1922 / והיינו גרים כפי שדובר לפני החתונה", "isnew": false}], "new": false, "hero": true, "poly": [[0, 0], [100, 0], [100.0, 77.24], [0.0, 70.24]]}, {"id": "B01V07-P39-02", "shows": "עובדים בחנות. חוה מתוארת כמוכרת מוכשרת ופעילה.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "חוה עבדה קשה בחנות. הקונים אהבו לקנות אצלה.", "en": "Chava worked hard in the shop. Customers loved to buy from her.", "kind": "adapted", "memoir": "כשחוה לא הייתה בחנות לא קנו. היו רק אצל חוהלה", "isnew": false}, {"type": "thought", "speaker": "יצחק", "he": "ארץ ישראל... לא אספר לאף אחד.", "en": "The Land of Israel... I won't tell anyone.", "kind": "adapted_thought", "memoir": "אבל אצלי היה רעיון ארץ-ישראל, ולא סיפרתי לאף אחד", "mouth": "above Yitzhak, wherever he stands in the shop", "isnew": true}], "new": false, "hero": false, "poly": [[41.17, 141.0], [0, 141.0], [0.0, 72.64], [34.57, 75.06]]}, {"id": "B01V07-P39-03", "shows": "כעבור זמן: בתם חנה רוזא, בכינוי חנהצ׳ילה, עם הוריה.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "נולדה לנו בת, חנה רוזא. קראנו לה חנהצ׳ילה.", "en": "A daughter was born to us, Chana Roza. We called her Chanatchile.", "kind": "adapted", "memoir": "נולדה new": true}], "new": false, "hero": false, "poly": [[42.83, 0.0], [100, 0], [100.0, 68.36], [49.31, 64.81]]}, {"id": "B01V07-P40-03", "shows": "יצחק החייל בשמירה בשלג, לבד, מתגעגע. בלי ירייה ובלי דרמה.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "שכבתי בשמירה בשלג, רחוק מהבית. בלי שבת, בלי חג, בלי אוכל כשר.", "en": "I lay on guard in the snow, far from home. No Shabbat, no holiday, no kosher food.", "kind": "adapted", "memoir": "ואני צריך כאן לשכב, לא שבת, לא חג, ולא אוכל, לא אכלתי טרף", "isnew": false}, {"type": "thought", "speaker": "יצחק", "he": "בבית מחכות לי חוה והילדה. בשביל מה לי כל זה?", "en": "Chava and our little girl are waiting at home. What is all this for?", "kind": "adapted_thought", "memoir": "ילדה נחמדה, מאד התגעגעתי מהבית... בשביל מה לי כל זה", "mouth": "center", "isnew": true}], "new": false, "hero": true, "poly": [[53.94, 141.0], [0, 141.0], [0.0, 63.76], [61.23, 68.04]]}, {"id": "B01V07-P40-04", "shows": "בדיקות רפואיות לקראת שחרור, ללא הדרכת תרמית או תרגיל ירי.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "בסוף שחררו אותי. חזרתי הביתה, ולחלום שלי: לבנות בית בארץ ישראל.", "en": "In the end I was released. I went home, back to my dream: building a home in the Land of Israel.", "kind": "adapted", "memoir": "ואני דאגתי איך לצאת מהצבא / רעיון ארץ-ישראל", "isnew": false}], "new": false, "hero": false, "poly": [[100.0, 70.76], [100, 141.0], [56.34, 141.0], [63.62, 68.21]]}], "H": 141.0}, {"n": 41, "title": "חזרתי, והחלום איתי", "pace": "normal", "recipe": "2-wide", "note": "הכיתוב 'סיפרתי לאבא של חוה' הפך לבועה עם המילים מהיומן ('אגלה לו סוד'), ופאנל 04 החוזר אוחד לתוך 03 שהפך לגיבור הדף.", "panels": [{"id": "B01V07-P41-01", "shows": "תווית זמן מפורשת: פורים 1923, חזרה מהצבא.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "בפורים 1923 חזרתי הביתה.", "en": "On Purim 1923 I came home.", "kind": "adapted", "memoir": "אחרי 3 ימים נסעתי הביתה חופשי, זה היה ב-1923 בפורים", "isnew": false}], "new": false, "hero": false, "poly": [[0, 0], [47.7, 0.0], [53.45, 47.91], [0.0, 51.65]]}, {"id": "B01V07-P41-02", "shows": "המשפחה בחדר; הילדה חולה ושוכבת, בלי דרמה. חוה והילדה בגיל מתאים.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "חזרתי הביתה בלי סחורה, בלי כסף, והילדה חולה. אבל רעיון ארץ ישראל נשאר אצלי.", "en": "I came home with no goods, no money, and the child was sick. But the idea of the Land of Israel stayed with me.", "kind": "adapted", "memoir": "באתי הביתה ללא סחורה, לא כסף, ילדה חולה", "isnew": false}], "new": false, "hero": false, "poly": [[50.1, 0.0], [100, 0], [100.0, 44.65], [55.83, 47.74]]}, {"id": "B01V07-P41-03", "shows": "יצחק מראה לחותנו את ההמלצות הישנות.", "art": null, "texts": [{"type": "speech", "speaker": "יצחק", "he": "אגלה לך סוד: יש לי סרטיפיקט והמלצות טובות לנסוע לארץ ישראל.", "en": "I'll tell you a secret: I have a certificate and good recommendations to go to the Land of Israel.", "kind": "adapted_speech", "memoir": "אמרתי לחותני שאגלה לו סוד, יש לי סרטיפיקט והמלצות טובות לנסוע לארץ", "mouth": "Yitzhak right, holding the papers; father-in-law left", "isnew": true}, {"type": "caption", "speaker": "יצחק המבוגר", "he": "התחלתי שוב לברר מה צריך לעשות.", "en": "I started again to find out what had to be done.", "kind": "adapted", "memoir": "הלכתי להתייעץ איתה והראתי לה את ההמלצות שלי", "isnew": false}], "new": false, "hero": true, "poly": [[100.0, 47.05], [100, 141.0], [0, 141.0], [0.0, 54.05]]}], "H": 141.0}, {"n": 42, "title": "הניירות נשמרו", "pace": "slow", "recipe": "grow-4", "note": "הכיתוב 'שלחו אותי הביתה לחכות' הפך לבועה הקצרה מהיומן 'תיסע הביתה', ופאנל 04 נשאר שקט וגדול כדי שהקורא ירגיש את ההמתנה.", "panels": [{"id": "B01V07-P42-01", "shows": "פגישות והתייעצות כפי שהיומן מתאר, ללא דיוקנאות חדשים שהוכרזו מזוהים.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "התייעצתי עם אנשים שהכירו את הדרך. ביקשו שאגיש בקשת עלייה מסודרת.", "en": "I consulted people who knew the way. They asked me to submit a proper request to immigrate.", "kind": "adapted", "memoir": "רק לפנות בדומברובה עם בקשה לעלייה  וזה יגיע אלינו ואנחנו נאשר מיד", "isnew": false}, {"type": "speech", "speaker": "מי שחזרה מהארץ", "he": "לא להזניח את הזמן", "en": "Don't let the time slip away", "kind": "quote", "memoir": "הייתה איתי בדעה, לא להזניח את הזמן וגם הסרטיפיקט", "mouth": "left, facing Yitzhak (unnamed, no identified portrait)", "isnew": true}], "new": false, "hero": false, "poly": [[0, 0], [100, 0], [100.0, 14.65], [0.0, 11.15]]}, {"id": "B01V07-P42-02", "shows": "משרד ארץ ישראל בוורשה פותח את תיקו.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "ב־1925 הזמינו אותי למשרד ארץ ישראל בוורשה.", "en": "In 1925 I was invited to the Palestine Office in Warsaw.", "kind": "adapted", "memoir": "קיבלתי מכתב ממשרד ארץ ישראלי לבוא לוורשה", "isnew": false}], "new": false, "hero": false, "poly": [[100.0, 17.05], [100.0, 34.98], [0.0, 39.18], [0.0, 13.55]]}, {"id": "B01V07-P42-03", "shows": "תיק ובו המלצות משנת 1916 עד 1925, תאריכים בשכבת HTML.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "שם עוד שמרו את ההמלצות שלי, משנת 1916 והלאה.", "en": "There they still kept my recommendations, from 1916 on.", "kind": "adapted", "memoir": "הוציאו כל התיק שלי, עם כל המלצות משנת 1916 עד שנת 1925", "isnew": false}, {"type": "speech", "speaker": "במשרד", "he": "תיסע הביתה.", "en": "Go home.", "kind": "quote", "memoir": "ואמרו תיסע הביתה", "mouth": "clerk behind the file, left", "isnew": true}], "new": false, "hero": false, "poly": [[100.0, 37.38], [100.0, 86.69], [0.0, 79.69], [0.0, 41.58]]}, {"id": "B01V07-P42-04", "shows": "יצחק בבית אחרי הביקור, מחכה לתשובה בלי מספר ימים מומצא.", "art": null, "texts": [], "new": false, "hero": true, "poly": [[100.0, 89.09], [100, 141.0], [0, 141.0], [0.0, 82.09]]}], "H": 141.0}, {"n": 43, "title": "עוד אישור אחד", "pace": "normal", "recipe": "wide-3", "note": "בלי שינוי בטקסט; שלושה פאנלים צרים בונים לחץ אל הפאנל הגדול של התנאי 'לצאת בזמן'.", "panels": [{"id": "B01V07-P43-01", "shows": "מגיע מכתב אישור עלייה.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "הגיעה תשובה: אישרו לנו לעלות.", "en": "An answer came: we were approved to immigrate.", "kind": "adapted", "memoir": "אחרי זמן קצר קיבלתי מכתב, שאושרתי לעלייה", "isnew": false}], "new": false, "hero": false, "poly": [[0, 0], [100, 0], [100.0, 62.93], [0.0, 55.93]]}, {"id": "B01V07-P43-02", "shows": "נייר עלייה מול מקום נפרד לדרכון, כרכיב גרפי בלבד.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "אבל כדי לצאת מפולין היינו צריכים גם דרכון.", "en": "But to leave Poland we also needed a passport.", "kind": "adapted", "memoir": "רק שלא יכולתי לקבל פספורט", "isnew": false}], "new": false, "hero": false, "poly": [[27.93, 141.0], [0, 141.0], [0.0, 58.33], [19.81, 59.72]]}, {"id": "B01V07-P43-03", "shows": "טיפול בניירות ובמיסוי; אין המחשה חיובית של דיווח כתובת כוזבת.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "היו ענייני מס וניירת שצריך היה להסדיר. לבסוף קיבלתי את הדרכון.", "en": "There were taxes and paperwork to settle. In the end I got the passport.", "kind": "adapted", "memoir": "הייתי חייב מיסים על שמי ומיסים של חוה ... במשך שעתיים קיבלתי את הפספורט", "isnew": false}], "new": false, "hero": false, "poly": [[60.86, 141.0], [30.33, 141.0], [22.22, 59.89], [52.96, 62.04]]}, {"id": "B01V07-P43-04", "shows": "לאחר קבלת הדרכון, יצחק במשרד העלייה בוורשה מקבל את התנאי לצאת בזמן. נציג המשרד נראה מדבר, יצחק מקשיב. אזור שקט לבועה משמאל, פני הדובר במרכז־ימין; אין תאריך או שעון שהומצאו.", "art": null, "texts": [{"type": "speech", "speaker": "במשרד העלייה", "he": "אם לא תצא בזמן, האישור יעבור למישהו אחר.", "en": "If you don't leave on time, the permit goes to someone else.", "kind": "adapted_speech", "memoir": "במקרה ולא אבוא בזמן, ימסרו את הסרטפיקט למישהו אחר", "mouth": "speaker center-right, bubble in the quiet area on the left", "isnew": false}], "new": false, "hero": true, "poly": [[100.0, 65.33], [100, 141.0], [63.26, 141.0], [55.38, 62.21]]}], "H": 141.0}, {"n": 44, "title": "מה לוקחים לדרך", "pace": "normal", "recipe": "3-wide", "note": "הפרימוס והאוכל היבש הפכו לעיגול פרט מעל החיבור, והכיתוב 'פחדתי לחכות' הפך לבועת מחשבה מעל המשפחה המוכנה לצאת. עורך: העיגול הפך לפאנל רגיל בפריסה (בקשת המשתמש: עיגול רק פעם או פעמיים בספר).", "panels": [{"id": "B01V07-P44-01", "shows": "סידורי מכירת הרכוש ואריזה, ללא פירוט תכסיס רהיטים.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "מכרנו, סידרנו וארזנו. לקחתי סל גדול לחפצים שלנו.", "en": "We sold, arranged and packed. I took a big basket for our things.", "kind": "adapted", "memoir": "מכרתי הכל ... גם קניתי וסידרתי מין סל גדול גדול", "isnew": false}], "new": false, "hero": false, "poly": [[0, 0], [30.64, 0.0], [34.72, 40.76], [0.0, 43.19]]}, {"id": "B01V07-P44-02", "shows": "סל גדול, שמיכות וכרים.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "שמיכות וכרים, פרימוס, וקצת אוכל יבש שיהיה לנו כשנגיע: שומן, גריסים ואטריות.", "en": "Blankets and pillows, a Primus stove, and a little dry food for when we arrived: fat, groats and noodles.", "kind": "adapted", "memoir": "לקחתי איתי מכונת פרימוס, וגם קצת אוכל, שיהיה לנו מה לאכול כי נבוא ארצה - שומן בשר, גריסים ואטריות", "isnew": false}], "new": false, "hero": false, "poly": [[33.04, 0.0], [63.77, 0.0], [67.62, 38.46], [37.1, 40.59]]}, {"id": "B01V07-P44-03", "shows": "פרימוס ומזון יבש, פרטים מוחשיים מן המקור.", "art": null, "texts": [], "new": false, "hero": false, "poly": [[66.17, 0.0], [100, 0], [100.0, 36.19], [70.0, 38.29]]}, {"id": "B01V07-P44-04", "shows": "חוה, יצחק ובתם מוכנים לצאת, לא תאומות או ילדים שטרם נולדו.", "art": null, "texts": [{"type": "thought", "speaker": "יצחק", "he": "חשבתי שניסע יחד עם הקרובים... אבל אני מפחד לחכות.", "en": "I thought we'd travel together with our relatives... but I'm afraid to wait.", "kind": "adapted_thought", "memoir": "חשבתי  כי אני ושמעונלה ובלצ'י ז\"ל  ניסע יחד. אבל פחדתי לחכות", "mouth": "above Yitzhak, family ready by the door", "isnew": true}], "new": false, "hero": true, "poly": [[100.0, 38.59], [100, 141.0], [0, 141.0], [0.0, 45.59]]}], "H": 141.0}, {"n": 45, "title": "יש לכם איפה לישון?", "pace": "fast", "recipe": "3-wide", "note": "היציאה והרכבת מתמזגות לנסיעה אחת, והמשפט 'הם שאלו איפה נגור' הוסר מהכיתוב כי השאלה עצמה כבר נשמעת בבועה.", "panels": [{"id": "B01V07-P45-01", "shows": "מוצאי יום כיפור 1925, יציאה לוורשה.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "במוצאי יום כיפור יצאנו לוורשה. משם נסענו ברכבת לקונסטנצה שברומניה.", "en": "At the end of Yom Kippur we left for Warsaw. From there we took the train to Constanța in Romania.", "kind": "adapted", "memoir": "נסעתי לוורשה במוצאי יום כיפור, נסענו עם רכבת מוורשה עד קונסטנצה", "isnew": false}], "new": false, "hero": false, "poly": [[0, 0], [37.84, 0.0], [41.87, 40.26], [0.0, 43.19]], "fade": "e", "soft": true}, {"id": "B01V07-P45-02", "shows": "רכבת מוורשה לקונסטנצה ברומניה; מסלול בשכבה חיה.", "art": null, "texts": [], "new": false, "hero": false, "poly": [[25.84, 0.0], [63.75, 0.0], [67.59, 38.46], [29.95, 41.09]], "soft": true}, {"id": "B01V07-P45-03", "shows": "נוסעים חוזרים מארץ ישראל משוחחים עם יצחק.", "art": null, "texts": [{"type": "caption", "speaker": "יצחק המבוגר", "he": "בדרך פגשנו אנשים שחזרו מארץ ישראל.", "en": "On the way we met people coming back from the Land of Israel.", "kind": "adapted", "memoir": "בדרך פגשנו אנשים שחזרו בחזרה מארץ ישראל", "isnew": false}], "new": false, "hero": false, "poly": [[66.15, 0.0], [100, 0], [100.0, 36.19], [69.97, 38.29]], "soft": true}, {"id": "B01V07-P45-04", "shows": "נוסע מבוגר בדרך שואל את יצחק; שני הדוברים נראים לצד חפצי המשפחה. פני השואל מימין ושטח שקט לבועה משמאל. חוה ובתם אם נראות הן משפחתו, אין ילדים נוספים שמוצגים כילדיו.", "art": null, "texts": [{"type": "speech", "speaker": "נוסעים בדרך",

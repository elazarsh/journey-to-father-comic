<style>
:root{--room:#0d0907;--ink:#1b1410;--gold:#e0a84f;--paper:#fffdf6;--rim:#efe3c8;--cap:#fff6e4;--capbg:rgba(10,7,4,.62);--muted:#b9a88c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--room);color:var(--cap);font-family:Heebo,system-ui,sans-serif}
header{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding:.6rem 16px;background:rgba(13,9,7,.92);backdrop-filter:blur(6px);border-bottom:1px solid #3a2a18}
header h1{margin:0;font:900 1.25rem 'Frank Ruhl Libre',serif;color:var(--gold)}
header .prog{font-size:.85rem;color:var(--muted)}
header .bar{display:inline-block;width:120px;height:6px;border-radius:3px;background:#2b2016;vertical-align:middle;margin-inline-start:.4rem;overflow:hidden}
header .bar i{display:block;height:100%;background:var(--gold)}
header .ctl{display:flex;gap:.4rem;flex-wrap:wrap}
header button{font:700 .8rem Heebo,sans-serif;color:var(--cap);background:#2a1d12;border:1px solid #5a4126;border-radius:999px;padding:.35rem .8rem;cursor:pointer}
header button[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
main{padding:2vh 16px 10vh}
.pagewrap{max-width:860px;margin:0 auto 6vh}
.plabel{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 .5rem;color:var(--muted);font-size:.8rem;letter-spacing:.08em}
.plabel b{font:700 1rem 'Frank Ruhl Libre',serif;color:var(--cap);letter-spacing:0}
.note{display:none;margin:.6rem 0 0;padding:.6rem .8rem;border-inline-start:3px solid var(--gold);background:#1d140c;color:#e9dcc3;font-size:.85rem;line-height:1.5}
body.work .note{display:block}
.page{position:relative;width:100%;aspect-ratio:100/141;container-type:inline-size;background:#140e09;border-radius:4px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.cv{position:absolute;inset:1.8%}
.pw{position:absolute;filter:drop-shadow(1.5px 0 0 var(--rim)) drop-shadow(-1.5px 0 0 var(--rim)) drop-shadow(0 1.5px 0 var(--rim)) drop-shadow(0 -1.5px 0 var(--rim)) drop-shadow(0 14px 18px rgba(0,0,0,.5))}
.pw.soft{filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.pw.circle{z-index:6}
.pw.morphtop{z-index:3}
.shape{position:absolute;inset:0;overflow:hidden;background:#2a2119}
.pw.circle .shape{border-radius:50%;box-shadow:inset 0 0 0 3px var(--rim)}
.shape img{width:100%;height:100%;object-fit:cover;object-position:50% 32%;display:block;transform:scale(1.03)}
html[dir=ltr] .shape img{transform:scale(1.03) scaleX(-1)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.5em;padding:12% 10%;text-align:center;background:repeating-linear-gradient(135deg,#3b3026 0 8px,#362b22 8px 16px);color:#d8c7aa;font-size:1.55cqw;line-height:1.35}
.ph em{font-style:normal;font:700 .85em Heebo;letter-spacing:.12em;color:var(--gold);border:1px solid #6a4f2c;border-radius:999px;padding:.15em .7em}
.ph.new em{background:#5b3a12}
.ph .pur{display:none;color:#ffd27a;font-size:.9em}
body.work .ph .pur{display:block}
.redo{position:absolute;inset-inline:6%;bottom:6%;z-index:5;background:rgba(20,12,4,.82);border:1px dashed #ffb84d;border-radius:.6em;padding:.35em .6em;color:#ffe2ad;font-size:clamp(.5rem,1.15cqw,.72rem);line-height:1.3;text-align:start;inset-inline:auto 3%;max-width:62%}
.redo span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.redo b{display:block;color:#ffb84d;font-family:Heebo;letter-spacing:.06em}
.pid{display:none;position:absolute;bottom:3px;inset-inline-start:4px;font:700 9px Heebo;color:#ffe9b8;background:rgba(0,0,0,.6);padding:1px 4px;border-radius:3px;z-index:4;direction:ltr}
body.work .pid{display:block}
/* lettering */
.tx{position:absolute;z-index:20;font-size:clamp(.62rem,1.85cqw,1.12rem);line-height:1.3;text-wrap:balance;text-align:center}
.tx.cap{font-family:'Frank Ruhl Libre',serif;font-weight:700;color:var(--cap);background:var(--capbg);box-shadow:0 0 1em .6em var(--capbg);padding:.15em .35em;border-radius:.6em;text-shadow:0 1px 2px #000;text-align:start}
.tx.bub,.tx.tho,.tx.whi{font-family:Rubik,sans-serif;font-weight:600;color:var(--ink);background:var(--paper);border:2.6px solid var(--ink);border-radius:50%/46%;padding:.7em 1.15em;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.tx.tho{border-radius:42%/40%}
.tx.whi{border-style:dashed}
.tx.sho{font-family:Rubik,sans-serif;font-weight:700;color:var(--ink);background:#ffe27a;border:2.6px solid var(--ink);padding:.7em 1.1em;clip-path:polygon(0 18%,12% 0,25% 14%,40% 0,55% 12%,70% 0,84% 14%,100% 4%,92% 30%,100% 52%,90% 70%,100% 92%,80% 86%,64% 100%,50% 86%,34% 100%,20% 86%,4% 96%,10% 70%,0 50%,8% 32%)}
.tx .who{display:none}
.tx svg.kids{width:7.5em;height:4.2em;display:block}
.tail{position:absolute;z-index:21;overflow:visible;pointer-events:none}
.flag{display:none;position:absolute;top:-.7em;inset-inline-end:-.6em;font-size:.75em;background:#2a1d12;color:#ffd27a;border:1px solid #6a4f2c;border-radius:999px;padding:0 .4em;font-family:Heebo;font-weight:800}

body.work .flag.on{display:block}
.legend{display:none;max-width:860px;margin:0 auto 3vh;padding:.8rem 1rem;background:#1d140c;border:1px solid #3a2a18;border-radius:8px;font-size:.85rem;line-height:1.6;color:#e9dcc3}
body.work .legend{display:block}
.intro{max-width:860px;margin:3vh auto 4vh;text-align:center}
.intro h2{margin:0;font:900 clamp(2rem,6vw,3.4rem) 'Frank Ruhl Libre',serif;color:var(--gold)}
.intro p{margin:.4rem 0 0;color:var(--muted)}
/* phone: one column, each panel its own block, text big */

/* special pages: cover, title, closing card, back cover */
.sp{position:relative;width:100%;aspect-ratio:210/297;overflow:hidden;border-radius:4px;background:#120b06;color:#f6ead2;container-type:inline-size;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.sp .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sp .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,3,.82) 0%,rgba(10,6,3,.15) 38%,rgba(10,6,3,.1) 60%,rgba(10,6,3,.88) 100%)}
.sp .frame{position:absolute;inset:3.8%;border:1px solid rgba(224,168,79,.65);pointer-events:none}
.sp .in{position:absolute;inset:7% 8%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.6cqw}
.sp .kick{font:700 2.1cqw Heebo;letter-spacing:.3em;color:#e9c98c}
.sp h2{margin:0;font:900 13cqw/1 'Frank Ruhl Libre',serif;color:#f2c46a;text-shadow:0 0 3cqw rgba(255,180,90,.45),0 .4cqw .8cqw #000}
.sp .sub{font:700 3.6cqw 'Frank Ruhl Libre',serif;color:#fff1d6}
.sp .by{margin-top:auto;font:500 2.6cqw 'Frank Ruhl Libre',serif;color:#ead9b8}
.sp.title .in{justify-content:center;gap:4cqw}
.sp.title q{font:700 6cqw/1.3 'Frank Ruhl Libre',serif;color:#f2c46a;quotes:none}
.sp.title p{font:500 3cqw/1.6 'Frank Ruhl Libre',serif;color:#e7d6b6;max-width:80%}
.sp.close{background:radial-gradient(ellipse at 50% 40%,#3a2612,#120b06 75%)}
.sp.close .in{justify-content:center;gap:5cqw}
.card{background:#fbf5e6;color:#1b1410;width:78%;padding:6cqw 6cqw 5cqw;border-radius:1.2cqw;box-shadow:0 2cqw 4cqw rgba(0,0,0,.5);background-image:repeating-linear-gradient(transparent 0 6.4cqw,#d9cdb4 6.4cqw 6.55cqw);text-align:start}
.card h3{margin:0 0 3cqw;font:900 5.4cqw 'Frank Ruhl Libre',serif;color:#7a2a1a;text-align:center}
.card ol{margin:0;padding:0;list-style:none;display:grid;gap:2.6cqw;counter-reset:k}
.card li{counter-increment:k;display:flex;gap:2.4cqw;align-items:center;font:700 4cqw/1.4 'Frank Ruhl Libre',serif}
.card li::before{content:counter(k);flex:none;width:6cqw;height:6cqw;border-radius:50%;background:#b23a26;color:#fff;font:800 3.4cqw/6cqw Heebo;text-align:center}
.sp .cont{font:900 6cqw 'Frank Ruhl Libre',serif;color:#f2c46a}
.sp.back .in{justify-content:center;gap:3.4cqw}
.sp.back .blurb{font:500 3.3cqw/1.65 'Frank Ruhl Libre',serif;color:#f3e8d2;max-width:86%;display:grid;gap:2.2cqw}
.sp.back .for{font:700 2.8cqw Heebo;color:#e9c98c;letter-spacing:.06em}
/* print: one A4 sheet per section, nothing else */
html.print header,html.print .plabel,html.print .note,html.print .legend,html.print .intro{display:none!important}
html.print main{padding:0}
html.print .pagewrap{max-width:none;width:794px;margin:0}
html.print .page,html.print .sp{border-radius:0;box-shadow:none}
html.print .page{aspect-ratio:210/297!important;background:#0d0907}
html.print .pw{animation:none!important}
@media (max-width:700px){
  .cv{position:static;display:flex;flex-direction:column;gap:14px}
  .page{aspect-ratio:auto;background:none;box-shadow:none;display:flex;flex-direction:column;gap:14px}
  .pw{position:relative!important;left:auto!important;top:auto!important;width:100%!important;container-type:inline-size}
  .pw.circle{width:72%!important;align-self:center}
  .tx{font-size:clamp(.85rem,4.1cqw,1.08rem)}
  .ph{font-size:3.6cqw}
}
@media (prefers-reduced-motion:no-preference){.pw{animation:in .6s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}}}
